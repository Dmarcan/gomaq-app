name: gomaq_web
description: "Panel web y Android de GOMAQ (administrativo, gerente y portal del cliente)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # usePathUrlStrategy(): URLs sin '#'. Viene con el SDK, pero hay que declararlo.
  flutter_web_plugins:
    sdk: flutter
  # Selectores de fecha y hora (y textos de Material) en español.
  flutter_localizations:
    sdk: flutter

  gomaq_comun:
    path: ../comun

  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^10.3.0
  # Arrastrar un PDF a la zona de carga (web y escritorio; en Android no hace nada). 0.9.x pide Flutter >= 3.47.7.
  desktop_drop: ^0.8.4
  fl_chart: ^0.69.0
  go_router: ^18.0.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Tipografía de GOMAQ (licencia OFL, ver assets/fonts/OFL-*.txt): Inter para el texto y las cifras de
  # las tablas, Barlow para títulos y cifras grandes. Van dentro de la app: terreno trabaja sin conexión.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

  # Logotipo de GOMAQ (el mismo de la app del mecánico), en versión para fondo claro y oscuro.
  assets:
    - assets/logo_gomaq_sobre_claro.png
    - assets/logo_gomaq_sobre_oscuro.png
    - assets/g_gomaq_gris.png
