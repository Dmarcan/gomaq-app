# Tests del backend y del panel en cada push y pull request.
#
# Railway despliega main automaticamente, con "Wait for CI": si este workflow falla, ese commit no
# llega a produccion. Por eso corren los tres niveles de la bateria, no solo las funciones puras:
#
#   - reglas de negocio y autorizacion (sin base de datos)
#   - escritura: reintentos de la cola offline, anulacion de lineas, ciclo de vida de la OT
#   - extremo a extremo: contra el backend levantado aca mismo, no contra produccion
#
# El job "panel" corre analyze y test de comun/ y panel/ con la misma version de Flutter que el
# Dockerfile. Va en este workflow (y no en uno aparte) porque Railway espera el resultado de cada
# workflow: si el panel no pasa, no se despliega. La app del mecanico tiene el suyo, mobile.yml.
#
# La base es un Postgres temporal que GitHub crea y borra en cada ejecucion. Los secretos son de
# prueba: el workflow no necesita ninguna credencial real (Supabase no se llama en estos casos).

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gomaq
          POSTGRES_PASSWORD: gomaq
          POSTGRES_DB: gomaq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gomaq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gomaq:gomaq@localhost:5432/gomaq
      JWT_SECRET: secreto-solo-para-ci
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_KEY: clave-solo-para-ci
      GOMAQ_TEST_ESCRITURA: '1'
      GOMAQ_TEST_URL: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # una migracion nueva tambien tiene que aplicar sobre filas ya existentes (en produccion siempre
      # las hay): migra una base vacia hasta la version base, carga un fixture y aplica las migraciones
      # posteriores. Corre en una base aparte que crea y borra el propio script; la base de las pruebas
      # de abajo no se toca
      - name: Probar migraciones con datos
        run: node scripts/probar_migraciones_con_datos.js

      # el mismo script que corre Railway al arrancar: si una migracion no aplica sobre una base
      # vacia, falla aca antes de llegar a produccion
      - name: Aplicar esquema y migraciones
        run: node scripts/migrar.js

      - name: Cargar datos de prueba
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../db/scripts/semilla_pruebas.sql

      # la API corre con el rol limitado de la migracion 041 (sin DDL ni borrado del historial de ordenes),
      # como en produccion cuando se cambia su DATABASE_URL; los tests y los scripts siguen con el dueno
      - name: Dar login al rol limitado de la API
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE gomaq_app LOGIN PASSWORD 'gomaq_app'"

      - name: Levantar el backend para los tests de extremo a extremo
        env:
          DATABASE_URL: postgres://gomaq_app:gomaq_app@localhost:5432/gomaq
          # el worker de notificaciones corre aparte; dentro del servidor compite con las pruebas
          NOTIFICACIONES_EN_PROCESO: '0'
        run: |
          node server.js > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat servidor.log
          exit 1

      - name: Tests
        run: node --test --test-concurrency=1 --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=tap.txt "test/**/*.test.js"

      # una prueba omitida (por falta de datos o de la base) no debe pasar en silencio
      - name: Ninguna prueba omitida
        if: success()
        run: grep -q '^# skipped 0$' tap.txt || (grep '# SKIP' tap.txt; exit 1)

      - name: Log del backend si algo fallo
        if: failure()
        run: cat servidor.log || true

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # misma version que el ARG FLUTTER_VERSION del Dockerfile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # un solo pubspec.lock en la raiz para comun/ y panel/; falla si no coincide con los pubspec
      - name: Dependencias del workspace
        run: flutter pub get --enforce-lockfile

      # los avisos de nivel info (hoy hay 1) no rompen el build; errores y warnings si
      - name: Analizar comun
        working-directory: comun
        run: dart analyze

      - name: Tests de comun
        working-directory: comun
        run: dart test

      - name: Analizar el panel
        working-directory: panel
        run: flutter analyze --no-fatal-infos

      - name: Tests del panel
        working-directory: panel
        run: flutter test
