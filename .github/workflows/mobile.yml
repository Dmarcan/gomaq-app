# Analisis y tests de la app del mecanico.
#
# Va en un workflow aparte de tests.yml porque Railway espera el resultado de cada workflow, no
# de cada job: un rojo aqui bloquearia el despliegue del backend aunque nada de la app cambiara.
# Con "paths" solo corre si cambia terreno/ o comun/ (que la app usa por path); si no corre, Railway
# no lo espera. terreno/ no es miembro del workspace de Dart y conserva su propio pubspec.lock.

name: Mobile

on:
  push:
    branches: [main]
    paths: ['terreno/**', 'comun/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['terreno/**', 'comun/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: terreno

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get --enforce-lockfile

      # hoy hay 7 avisos de nivel info (use_null_aware_elements en sync_service.dart): no se
      # tocan para no mover la cola offline sin necesidad
      - name: Analizar
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test
