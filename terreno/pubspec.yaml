name: gomaq_mecanico
description: "App del mecánico de GOMAQ (Android, offline-first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  gomaq_comun:
    path: ../comun

  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  signature: ^6.3.0
  intl: ^0.20.3
  geolocator: ^14.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # base SQLite real en las pruebas de la cola de sincronizacion (sin telefono ni emulador)
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  # Tipografía de GOMAQ (licencia OFL, ver assets/fonts/OFL-*.txt): Inter para el texto y las cifras de
  # las tablas, Barlow para títulos y cifras grandes. Van dentro de la app: terreno trabaja sin conexión.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

  assets:
    - assets/logo_gomaq_sobre_oscuro.png
    - assets/logo_gomaq_sobre_claro.png
